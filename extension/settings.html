<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajustes de StopIt</title>
    <link rel="stylesheet" href="settings.css">
    <script src="preferences.js" defer></script>
    <script src="settings.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Ajustes de StopIt</h1>
      <label for="notifications">
        <span>
          <strong id="name">Mostrar notificaciones</strong>
          <span id="description">Campana y panel de la barra superior de YouTube.</span>
        </span>
        <input type="checkbox" role="switch" id="notifications" aria-labelledby="name" aria-describedby="description" disabled>
      </label>
      <p id="error" role="status"></p>
    </main>
  </body>
</html>
